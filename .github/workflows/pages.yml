name: Публикация сайта (GitHub Pages)

# Публикует сайт при каждом пуше в main и после ежедневного обновления дропа.
# (Коммит бота с GITHUB_TOKEN не запускает push-воркфлоу, поэтому нужен workflow_run.)
# Разовая настройка: Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['Обновление данных дропа']
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # после workflow_run берём свежий коммит с данными, а не старый SHA

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Проверить данные
        run: node tools/test-atlas.cjs

      # Публикуем только то, что нужно странице.
      - name: Собрать _site
        run: |
          mkdir _site
          cp -r index.html css js data media _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
