<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tenno Atlas — Warframe farm map</title>
  <meta name="description" content="Interactive Warframe star chart: fly to any planet and see which relics, warframe parts and resources drop on every node. Prime farm planner, EN/RU." />
  <meta property="og:title" content="Tenno Atlas — Warframe farm map" />
  <meta property="og:description" content="Fly to a planet — see relics, warframe parts and resources on every node. Updated daily from the official drop tables." />
  <meta property="og:image" content="media/lotus-180.png" />
  <meta name="theme-color" content="#02030a" />
  <link rel="icon" type="image/x-icon" href="media/lotus.ico" />
  <link rel="apple-touch-icon" href="media/lotus-180.png" />

  <link rel="preconnect" href="https://cdn.warframestat.us" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Roboto+Condensed:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#02030a', txt: '#e9eef2', dim: '#8a9aa6', line: '#2a3a46',
            gold: '#e3b45e', cyan: '#7fd0e6', danger: '#e8455c',
          },
          fontFamily: {
            sans: ['Roboto', 'system-ui', 'sans-serif'],
            cond: ['"Roboto Condensed"', 'Roboto', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    } }
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body x-data class="bg-ink text-txt font-sans">

  <div id="chart" class="fixed inset-0">
    <div id="chart-labels" class="absolute inset-0 pointer-events-none"></div>
    <div class="no-webgl-msg">WebGL is not available in this browser.</div>
  </div>

  <header class="hud-top">
    <button @click="$store.wf.view ? $store.wf.closePlanet() : window.dispatchEvent(new CustomEvent('atlas:home'))" class="brand" aria-label="Tenno Atlas">
      <img src="media/lotus.png" alt="" class="brand-logo" />
      <span class="brand-text">
        <span class="brand-name">TENNO <b>ATLAS</b></span>
        <span class="brand-sub" x-text="$store.wf.t('tagline')"></span>
      </span>
    </button>

    <nav class="crumbs" x-show="$store.wf.loaded">
      <button @click="$store.wf.view && $store.wf.closePlanet()" :class="!$store.wf.view && 'on'" x-text="$store.wf.t('origin')"></button>
      <template x-if="$store.wf.view">
        <span class="flex items-center gap-2"><i class="crumb-sep"></i><span class="on" x-text="$store.wf.planetName($store.wf.view)"></span></span>
      </template>
    </nav>

    <div class="legend" x-show="$store.wf.loaded">
      <span x-show="$store.wf.planHits.size"><i class="lg-dot gold"></i><span x-text="$store.wf.t('your')"></span></span>
      <span x-show="$store.wf.focus" class="max-w-[220px]"><i class="lg-dot cyan"></i><span class="truncate" x-text="$store.wf.focus"></span></span>
    </div>

    <div class="flex items-center gap-2 ml-auto">
      <span class="controls-hint hud-meta" x-text="$store.wf.t('controls')"></span>
      <span class="hidden md:inline hud-meta" x-show="$store.wf.loaded" x-text="$store.wf.t('data_sync') + ' ' + $store.wf.dateStr()"></span>
      <button class="wf-btn lg:hidden" @click="$store.wf.togglePanel('left')" :class="$store.wf.panel==='left' && 'on'" x-text="$store.wf.t('planner_short')"></button>
      <button class="wf-btn lg:hidden" @click="$store.wf.togglePanel('right')" :class="$store.wf.panel==='right' && 'on'" x-text="$store.wf.t('search_short')"></button>
      <button class="wf-btn hidden md:inline-block" @click="$store.wf.toggleMode()" :class="$store.wf.mode==='late' && 'on'" :title="$store.wf.t('mode_hint')" x-text="$store.wf.mode==='late' ? $store.wf.t('mode_late') : $store.wf.t('mode_base')"></button>
      <button data-lang-toggle @click="$store.wf.toggleLang()" class="wf-btn" aria-label="Language">
        <span :class="$store.wf.lang==='en' ? 'text-gold' : 'text-dim'">EN</span><span class="text-line mx-1">/</span><span :class="$store.wf.lang==='ru' ? 'text-gold' : 'text-dim'">RU</span>
      </button>
      <button class="wf-btn w-[34px] px-0" @click="$store.wf.aboutOpen = !$store.wf.aboutOpen" :class="$store.wf.aboutOpen && 'on'" :aria-label="$store.wf.t('about')">i</button>
    </div>
  </header>

  <div x-show="$store.wf.aboutOpen" x-cloak x-transition.opacity class="about" @click.outside="$store.wf.aboutOpen = false">
    <div class="wf-head px-0 pt-0"><h2 x-text="$store.wf.t('about')"></h2><button class="wf-close" @click="$store.wf.aboutOpen = false">×</button></div>
    <p x-text="$store.wf.t('about_text')"></p>
    <button class="wf-btn mt-3 md:hidden" @click="$store.wf.toggleMode()" :class="$store.wf.mode==='late' && 'on'" x-text="$store.wf.mode==='late' ? $store.wf.t('mode_late') : $store.wf.t('mode_base')"></button>
    <p class="text-dim text-[11px] mt-1 md:hidden" x-text="$store.wf.t('mode_hint')"></p>
    <p class="text-dim text-[11px] mt-2" x-text="$store.wf.t('credits')"></p>
  </div>

  <div x-show="!$store.wf.loaded" class="loading">
    <img src="media/lotus.png" alt="" class="w-20 opacity-80 animate-pulse" />
    <span x-show="!$store.wf.error" x-text="$store.wf.t('loading')"></span>
    <span x-show="$store.wf.error" class="text-danger" x-text="$store.wf.t('data_error') + ': ' + $store.wf.error"></span>
  </div>

  <template x-if="$store.wf.loaded && $store.wf.view">
    <div class="planet-hud">
      <div class="ph-name" x-text="$store.wf.planetName($store.wf.view)"></div>
      <div class="ph-res">
        <template x-for="r in $store.wf.planetInfo($store.wf.view).res" :key="r[0]">
          <span :class="$store.wf.focus === r[0] && 'hit'"><img x-show="r[1]" :src="$store.wf.img(r[1])" alt="" /><span x-text="r[0]"></span></span>
        </template>
      </div>
      <button class="wf-btn mt-2" @click="$store.wf.closePlanet()" x-text="'‹ ' + $store.wf.t('back')"></button>
    </div>
  </template>

  <aside class="wf-panel panel-left" x-show="$store.wf.loaded" x-cloak :class="$store.wf.panel==='left' && 'open'">
    <div class="wf-head">
      <h2 x-text="$store.wf.t('planner')"></h2>
      <button x-show="$store.wf.selList.length" @click="$store.wf.clearSel()" class="wf-link" x-text="$store.wf.t('clear')"></button>
      <button class="wf-close lg:hidden" @click="$store.wf.panel=null" :aria-label="$store.wf.t('close')">×</button>
    </div>
    <div class="px-4 pb-3 space-y-3">
      <p class="text-xs text-dim leading-relaxed" x-text="$store.wf.t('planner_hint')"></p>
      <div class="wf-tabs">
        <button @click="$store.wf.tab='prime'" :class="$store.wf.tab==='prime' && 'on'" x-text="$store.wf.t('tab_prime')"></button>
        <button @click="$store.wf.tab='frames'" :class="$store.wf.tab==='frames' && 'on'" x-text="$store.wf.t('tab_frames')"></button>
      </div>
      <input type="search" x-model="$store.wf.filter" :placeholder="$store.wf.t('filter')" class="wf-input" />
    </div>

    <div class="wf-scroll flex-1">
      <template x-for="item in $store.wf.plannerList()" :key="item.pre + item.name">
        <div class="wf-item" :class="$store.wf.someSel(item) && 'sel'">
          <div class="flex items-center gap-2 px-3 py-1.5">
            <button @click="$store.wf.open[item.name] = !$store.wf.open[item.name]" class="flex items-center gap-2 flex-1 min-w-0 text-left">
              <img :src="$store.wf.img(item.img)" alt="" loading="lazy" class="w-8 h-8 object-contain shrink-0" onerror="this.style.visibility='hidden'" />
              <span class="text-sm truncate" x-text="item.name"></span>
            </button>
            <button @click="$store.wf.toggleSet(item)" class="wf-chip" :class="$store.wf.allSel(item) && 'on'" x-text="$store.wf.t('full_set')"></button>
          </div>
          <div x-show="$store.wf.open[item.name] || $store.wf.filter.length > 1" class="px-3 pb-2 pl-[52px] flex flex-wrap gap-1">
            <template x-for="p in item.parts" :key="p.name">
              <button @click="$store.wf.toggle(item.pre, p.name)" class="wf-chip" :class="$store.wf.isSel(item.pre, p.name) && 'on'" x-text="p.short"></button>
            </template>
          </div>
        </div>
      </template>
      <div x-show="!$store.wf.plannerList().length" class="p-4 text-sm text-dim" x-text="$store.wf.t('nothing')"></div>
    </div>

    <div class="spots">
      <div class="wf-head pt-3">
        <h3 x-text="$store.wf.t('best_spots')"></h3>
        <span class="text-[11px] text-dim" x-show="$store.wf.selList.length" x-text="$store.wf.t('selected') + ' ' + $store.wf.selList.length"></span>
      </div>
      <p x-show="$store.wf.ranking.length" class="px-4 text-[11px] text-dim leading-snug pb-1" x-text="$store.wf.t('best_hint')"></p>
      <div class="wf-scroll px-2 pb-3">
        <div x-show="!$store.wf.selList.length" class="px-2 text-xs text-dim" x-text="$store.wf.t('nothing_sel')"></div>
        <template x-for="(h, i) in $store.wf.ranking" :key="h.node.key">
          <button @click="$store.wf.openPlanet(h.node.p, h.node.key)" class="wf-row">
            <span class="wf-rank" x-text="i + 1"></span>
            <span class="flex-1 min-w-0">
              <span class="block text-sm truncate"><span x-text="$store.wf.nodeLabel(h.node)"></span> <span class="text-dim text-xs" x-text="'· ' + $store.wf.planetName(h.node.p)"></span></span>
              <span class="block text-[11px] text-dim truncate" x-text="$store.wf.typeName(h.node.t) + (h.rot ? ' · ' + $store.wf.rotName(h.rot) : '') + ' · ' + h.lines.map(l => l.name.replace(/ Relic.*$/, '')).join(', ')"></span>
            </span>
            <span class="wf-pct text-gold" x-text="$store.wf.fmt(h.eff)"></span>
          </button>
        </template>
      </div>
    </div>
  </aside>

  <aside class="wf-panel panel-right" x-show="$store.wf.loaded" x-cloak :class="$store.wf.panel==='right' && 'open'">
    <template x-if="$store.wf.pinnedNode()">
      <div class="flex flex-col min-h-0 flex-1">
        <div class="wf-head items-start">
          <div class="flex-1 min-w-0">
            <h2 x-text="$store.wf.t('node_details')"></h2>
            <div class="node-title" x-text="$store.wf.pinnedNode().n"></div>
            <div class="text-xs text-dim" x-text="$store.wf.planetName($store.wf.pinnedNode().p) + ' · ' + ($store.wf.typeName($store.wf.pinnedNode().t) || '—')"></div>
          </div>
          <button @click="$store.wf.pinned = null; $store.wf.emit()" class="wf-close" :aria-label="$store.wf.t('close')">×</button>
        </div>
        <div class="wf-scroll flex-1 px-3 pb-3 space-y-3">
          <template x-for="g in $store.wf.nodeGroups($store.wf.pinnedNode())" :key="g.rot">
            <div>
              <div x-show="g.rot" class="wf-sub" x-text="$store.wf.rotName(g.rot)"></div>
              <template x-for="r in g.rows" :key="r.it.name">
                <div class="drop-row" :class="$store.wf.isWanted($store.wf.pinnedNode(), r.it) && 'want'">
                  <img :src="$store.wf.itemImg(r.it)" alt="" loading="lazy" onerror="this.style.visibility='hidden'" />
                  <span class="flex-1 min-w-0">
                    <span class="block truncate text-sm" x-text="(r.qty ? r.qty + ' ' : '') + r.it.name"></span>
                    <span class="block text-[10px] uppercase tracking-wider" :style="'color:' + $store.wf.kindColor(r.it.kind)" x-text="$store.wf.kindName(r.it.kind)"></span>
                  </span>
                  <span class="wf-pct text-dim" x-text="$store.wf.fmt(r.ch)"></span>
                </div>
              </template>
            </div>
          </template>
        </div>
      </div>
    </template>

    <template x-if="!$store.wf.pinnedNode() && $store.wf.pinnedHub()">
      <div class="flex flex-col min-h-0 flex-1">
        <div class="wf-head items-start">
          <div class="flex-1 min-w-0">
            <h2 x-text="$store.wf.hubSub($store.wf.pinnedHub())"></h2>
            <div class="node-title" x-text="$store.wf.hubName($store.wf.pinnedHub())"></div>
            <div class="text-xs text-dim" x-text="$store.wf.planetName($store.wf.pinnedHub().p) + ' · ' + $store.wf.pinnedHub().nodes.length + ' ' + $store.wf.t('missions')"></div>
          </div>
          <button @click="$store.wf.closeHub()" class="wf-close" :aria-label="$store.wf.t('close')">×</button>
        </div>
        <p class="px-4 pb-2 text-[11px] text-dim" x-text="$store.wf.t('hub_hint')"></p>
        <div class="wf-scroll flex-1 pb-3">
          <template x-for="n in $store.wf.pinnedHub().nodes" :key="n.key">
            <button @click="$store.wf.pin(n.key)" @mouseenter="$store.wf.showTip($event, $store.wf.nodeTip(n))" @mousemove="$store.wf.moveTip($event)" @mouseleave="$store.wf.hideTip()" class="wf-row px-4">
              <span x-show="n.lvl" class="hub-lvl" x-text="n.lvl"></span>
              <span class="flex-1 min-w-0">
                <span class="block text-sm truncate" x-text="n.short"></span>
                <span class="block text-[11px] text-dim truncate" x-text="$store.wf.typeName(n.t)"></span>
              </span>
              <span class="wf-pct" :class="$store.wf.planHits.get(n.key) ? 'text-gold' : 'text-cyan'" x-text="$store.wf.planHits.get(n.key) ? $store.wf.fmt($store.wf.planHits.get(n.key).eff) : $store.wf.findHits.get(n.key) ? $store.wf.fmt($store.wf.findHits.get(n.key).eff) : ''"></span>
            </button>
          </template>
        </div>
      </div>
    </template>

    <div x-show="!$store.wf.pinnedNode() && !$store.wf.pinnedHub()" class="flex flex-col min-h-0 flex-1">
      <div class="wf-head">
        <h2 x-text="$store.wf.t('search')"></h2>
        <button class="wf-close lg:hidden" @click="$store.wf.panel=null" :aria-label="$store.wf.t('close')">×</button>
      </div>
      <div class="px-4 pb-3 space-y-2">
        <input type="search" x-model.debounce.150ms="$store.wf.q" :placeholder="$store.wf.t('search_ph')" class="wf-input" />
        <p x-show="$store.wf.q.length < 2 && !$store.wf.focus" class="text-[11px] text-dim" x-text="$store.wf.t('search_hint')"></p>
      </div>

      <div x-show="$store.wf.q.length >= 2" class="wf-scroll max-h-[42%] border-y border-line/60">
        <template x-for="e in $store.wf.results()" :key="e.kind + e.name">
          <button @click="$store.wf.pick(e)" class="wf-row px-3" :class="$store.wf.focus === e.name && 'on'">
            <img :src="e.img" alt="" loading="lazy" class="w-8 h-8 object-contain shrink-0" onerror="this.style.visibility='hidden'" />
            <span class="flex-1 min-w-0">
              <span class="block text-sm truncate" x-text="e.name"></span>
              <span class="block text-[10px] uppercase tracking-wider" :style="'color:' + $store.wf.kindColor(e.kind)" x-text="$store.wf.kindName(e.kind) + (e.kind === 'prime' ? ' · ' + ($store.wf.isSel('p:', e.name) ? $store.wf.t('in_plan') : $store.wf.t('add_plan')) : '')"></span>
            </span>
          </button>
        </template>
        <div x-show="!$store.wf.results().length" class="p-3 text-sm text-dim" x-text="$store.wf.t('nothing')"></div>
      </div>

      <div x-show="$store.wf.focus" class="wf-scroll flex-1">
        <div class="wf-head pt-3">
          <h3 class="text-cyan truncate normal-case tracking-normal text-sm" x-text="$store.wf.focus"></h3>
          <button @click="$store.wf.setFocus(null)" class="wf-link" x-text="$store.wf.t('clear')"></button>
        </div>
        <template x-for="p in $store.wf.focusResPlanets()" :key="p">
          <button @click="$store.wf.openPlanet(p)" class="wf-row px-4">
            <span class="flex-1 min-w-0">
              <span class="block text-sm" x-text="$store.wf.planetName(p)"></span>
              <span class="block text-[11px] text-dim" x-text="$store.wf.t('planet_res') + ' — ' + $store.wf.t('from_enemies')"></span>
            </span>
          </button>
        </template>
        <div x-show="$store.wf.findHits.size" class="wf-sub px-4 pt-2" x-text="$store.wf.t('drops_at')"></div>
        <template x-for="h in $store.wf.focusList()" :key="h.node.key">
          <button @click="$store.wf.openPlanet(h.node.p, h.node.key)" class="wf-row px-4">
            <span class="flex-1 min-w-0">
              <span class="block text-sm truncate"><span x-text="$store.wf.nodeLabel(h.node)"></span> <span class="text-dim text-xs" x-text="'· ' + $store.wf.planetName(h.node.p)"></span></span>
              <span class="block text-[11px] text-dim truncate" x-text="$store.wf.typeName(h.node.t) + (h.rot ? ' · ' + $store.wf.rotName(h.rot) : '') + (h.qty ? ' · ' + h.qty : '') + (h.via ? ' · ' + h.via : '')"></span>
            </span>
            <span class="wf-pct text-cyan" x-text="$store.wf.fmt(h.eff)"></span>
          </button>
        </template>
      </div>
    </div>
  </aside>

  <div class="zoom" x-show="$store.wf.loaded" x-cloak>
    <button class="wf-btn" @click="window.dispatchEvent(new CustomEvent('atlas:zoom', { detail: 1 }))" aria-label="Zoom in">+</button>
    <button class="wf-btn" @click="window.dispatchEvent(new CustomEvent('atlas:zoom', { detail: -1 }))" aria-label="Zoom out">−</button>
    <button class="wf-btn" @click="window.dispatchEvent(new CustomEvent('atlas:home'))" :aria-label="$store.wf.t('origin')">⌂</button>
  </div>

  <div x-show="$store.wf.tip.show" x-cloak class="map-tip" :style="'left:' + $store.wf.tip.x + 'px;top:' + $store.wf.tip.y + 'px'" x-html="$store.wf.tip.html"></div>
  <div x-show="$store.wf.toast" x-cloak x-transition class="toast" x-text="$store.wf.toast"></div>

  <script src="js/atlas.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <script type="module" src="js/starchart.js"></script>
</body>
</html>
