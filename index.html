<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tenno Atlas — Warframe farm map</title>
  <meta name="description" content="Interactive Warframe star chart: fly to any planet and see which relics, warframe parts and resources drop on every node. Prime farm planner, EN/RU." />
  <meta property="og:title" content="Tenno Atlas — Warframe farm map" />
  <meta property="og:description" content="Fly to a planet — see relics, warframe parts and resources on every node. Updated daily from the official drop tables." />
  <meta property="og:image" content="media/lotus-180.png" />
  <meta name="theme-color" content="#02030a" />
  <link rel="icon" type="image/x-icon" href="media/lotus.ico" />
  <link rel="apple-touch-icon" href="media/lotus-180.png" />

  <link rel="preconnect" href="https://cdn.warframestat.us" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Saira+Semi+Condensed:wght@400;500;600;700&family=Saira:wght@300;400;500&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#02030a', txt: '#e9eef2', dim: '#8a9aa6', line: '#2a3a46',
            gold: '#e3b45e', cyan: '#7fd0e6', danger: '#e8455c',
          },
          fontFamily: {
            sans: ['Saira', 'system-ui', 'sans-serif'],
            cond: ['"Saira Semi Condensed"', 'Saira', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    } }
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body x-data class="bg-ink text-txt font-sans" :class="{ 'has-right': $store.wf.loaded && !!($store.wf.view || $store.wf.pinned || $store.wf.hub) }">

  <div id="chart" class="fixed inset-0">
    <div id="chart-labels" class="absolute inset-0 pointer-events-none"></div>
    <div class="no-webgl-msg">WebGL is not available in this browser.</div>
  </div>

  <div class="worlds" x-show="$store.wf.loaded && !$store.wf.view" x-cloak>
    <template x-for="w in $store.wf.WORLDS" :key="w.p">
      <button type="button" class="world-card"
        :class="{ plan: !!$store.wf.planetHit(w.p).plan, find: $store.wf.planetHit(w.p).find, dim: $store.wf.anyHi() && !$store.wf.planetHit(w.p).plan && !$store.wf.planetHit(w.p).find }"
        @click="$store.wf.openPlanet(w.p)" @mouseenter="$store.wf.showTip($event, $store.wf.planetTip(w.p))" @mousemove="$store.wf.moveTip($event)" @mouseleave="$store.wf.hideTip()">
        <img :src="w.img" alt="" />
        <span class="dc-shade"></span>
        <span class="dc-name" x-text="$store.wf.planetName(w.p)"></span>
        <span class="dc-sub" x-text="$store.wf.cycleOf(w.p).length ? $store.wf.cycleOf(w.p)[0].label + ' · ' + $store.wf.left($store.wf.cycleOf(w.p)[0].expiry) : $store.wf.nodesOf(w.p).length + ' ' + $store.wf.t('nodes')"></span>
        <span class="dc-badge" x-show="$store.wf.planetHit(w.p).plan" x-text="($store.wf.planetHit(w.p).plan || {}).count"></span>
      </button>
    </template>
  </div>

  <template x-if="$store.wf.loaded && $store.wf.world()">
    <section class="world-view">
      <div class="dv-art"><img :src="$store.wf.world().img" alt="" /><span x-text="$store.wf.t($store.wf.world().tag)"></span></div>
      <div class="dv-nodes">
        <template x-for="n in $store.wf.nodesOf($store.wf.view)" :key="n.key">
          <button type="button" class="dv-node" :class="{ plan: $store.wf.planHits.has(n.key), find: !$store.wf.planHits.has(n.key) && $store.wf.findHits.has(n.key), pinned: $store.wf.pinned === n.key }"
            @click="$store.wf.pin(n.key)" @mouseenter="$store.wf.showTip($event, $store.wf.nodeTip(n))" @mousemove="$store.wf.moveTip($event)" @mouseleave="$store.wf.hideTip()">
            <i></i><span class="dv-n" x-text="$store.wf.worldLabel(n)"></span><span class="dv-t" x-text="$store.wf.worldSub(n)"></span>
          </button>
        </template>
      </div>
    </section>
  </template>

  <header class="hud-top">
    <button @click="$store.wf.view ? $store.wf.closePlanet() : window.dispatchEvent(new CustomEvent('atlas:home'))" class="brand" aria-label="Tenno Atlas">
      <img src="media/lotus.png" alt="" class="brand-logo" />
      <span class="brand-text">
        <span class="brand-name">TENNO <b>ATLAS</b></span>
        <span class="brand-sub" x-text="$store.wf.t('tagline')"></span>
      </span>
    </button>

    <nav class="crumbs" x-show="$store.wf.loaded">
      <button @click="$store.wf.view && $store.wf.closePlanet()" :class="!$store.wf.view && 'on'" x-text="$store.wf.t('origin')"></button>
      <template x-if="$store.wf.view">
        <span class="flex items-center gap-2"><i class="crumb-sep"></i><span class="on" x-text="$store.wf.planetName($store.wf.view)"></span></span>
      </template>
    </nav>

    <div class="flex items-center gap-2 ml-auto">
      <nav class="m-tools lg:hidden" x-show="$store.wf.loaded">
        <template x-for="k in ['farm', 'find', 'live']" :key="k">
          <button @click="$store.wf.setTool(k)" :class="$store.wf.panel === 'left' && $store.wf.tool === k && 'on'" x-text="$store.wf.t('tool_' + k)"></button>
        </template>
      </nav>
      <button class="late-toggle hidden md:inline-flex" @click="$store.wf.toggleMode()" :class="$store.wf.mode === 'late' && 'on'" :title="$store.wf.t('mode_hint')"><i></i><span x-text="$store.wf.t('late_toggle')"></span></button>
      <button data-lang-toggle @click="$store.wf.toggleLang()" class="lang-toggle" aria-label="Language">
        <span :class="$store.wf.lang==='en' && 'on'">EN</span><span :class="$store.wf.lang==='ru' && 'on'">RU</span>
      </button>
      <button class="wf-btn icon-btn" @click="$store.wf.aboutOpen = !$store.wf.aboutOpen" :class="$store.wf.aboutOpen && 'on'" :aria-label="$store.wf.t('about')"><svg viewBox="0 0 16 16" width="14" height="14"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor"/><path d="M8 7v4.5M8 4.6v.1" stroke="currentColor" stroke-width="1.4" stroke-linecap="square"/></svg></button>
    </div>
  </header>

  <div x-show="$store.wf.aboutOpen" x-cloak x-transition.opacity class="about" @click.outside="$store.wf.aboutOpen = false">
    <div class="wf-head px-0 pt-0"><h2 x-text="$store.wf.t('about')"></h2><button class="wf-close" @click="$store.wf.aboutOpen = false">×</button></div>
    <p x-text="$store.wf.t('about_text')"></p>
    <p class="text-dim text-[11px] mt-2" x-show="$store.wf.loaded" x-text="$store.wf.t('data_sync') + ': ' + $store.wf.dateStr()"></p>
    <button class="late-toggle mt-3 md:hidden" @click="$store.wf.toggleMode()" :class="$store.wf.mode === 'late' && 'on'"><i></i><span x-text="$store.wf.t('late_toggle')"></span></button>
    <p class="text-dim text-[11px] mt-1" x-text="$store.wf.t('mode_hint')"></p>
    <p class="text-dim text-[11px] mt-2" x-text="$store.wf.t('credits')"></p>
  </div>

  <div x-show="!$store.wf.loaded" class="loading">
    <img src="media/lotus.png" alt="" class="w-20 opacity-80 animate-pulse" />
    <span x-show="!$store.wf.error" x-text="$store.wf.t('loading')"></span>
    <span x-show="$store.wf.error" class="text-danger" x-text="$store.wf.t('data_error') + ': ' + $store.wf.error"></span>
  </div>

  <template x-if="$store.wf.loaded && $store.wf.view">
    <div class="planet-hud">
      <div class="ph-name" x-text="$store.wf.planetName($store.wf.view)"></div>
      <div class="ph-cycles" x-show="$store.wf.cycles().some(c => c.p === $store.wf.view)">
        <template x-for="c in $store.wf.cycles().filter(c => c.p === $store.wf.view)" :key="c.id">
          <span :class="'st-' + c.state"><i></i><em x-show="c.id === 'cetus'" x-text="c.place"></em><b x-text="c.label"></b><span x-text="$store.wf.left(c.expiry)"></span></span>
        </template>
      </div>
      <div class="ph-res">
        <template x-for="r in $store.wf.planetInfo($store.wf.view).res" :key="r[0]">
          <span :class="$store.wf.focus === r[0] && 'hit'"><img x-show="r[1]" :src="$store.wf.img(r[1])" alt="" /><span x-text="$store.wf.nm(r[0])"></span></span>
        </template>
      </div>
      <div class="flex items-center gap-4">
        <button class="back-link" @click="$store.wf.closePlanet()"><i></i><span x-text="$store.wf.t('back')"></span></button>
        <button class="back-link fwd lg:hidden" @click="$store.wf.togglePanel('right')"><span x-text="$store.wf.t('planet_btn')"></span><i></i></button>
      </div>
    </div>
  </template>

  <aside class="wf-panel panel-left" x-show="$store.wf.loaded" x-cloak :class="$store.wf.panel==='left' && 'open'">
    <div class="dock">
      <button @click="$store.wf.setTool('farm')" :class="$store.wf.tool === 'farm' && 'on'">
        <svg viewBox="0 0 20 20"><path d="M10 2l7 8-7 8-7-8z" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M10 6.5l3.2 3.5L10 13.5 6.8 10z" fill="currentColor"/></svg>
        <span x-text="$store.wf.t('tool_farm')"></span><b x-show="$store.wf.selList.length" x-text="$store.wf.selList.length"></b>
      </button>
      <button @click="$store.wf.setTool('find')" :class="$store.wf.tool === 'find' && 'on'">
        <svg viewBox="0 0 20 20"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M12.6 12.6l5 5" stroke="currentColor" stroke-width="1.3"/></svg>
        <span x-text="$store.wf.t('tool_find')"></span><b x-show="$store.wf.focus" class="cy">1</b>
      </button>
      <button @click="$store.wf.setTool('live')" :class="$store.wf.tool === 'live' && 'on'">
        <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M10 5.5V10l3 2" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
        <span x-text="$store.wf.t('tool_live')"></span><i class="live-dot" x-show="$store.wf.live.ok && !$store.wf.live.failed"></i>
      </button>
      <button class="wf-close lg:hidden ml-auto" @click="$store.wf.panel=null" :aria-label="$store.wf.t('close')">×</button>
    </div>

    <section class="tool" x-show="$store.wf.tool === 'farm'">
      <div class="px-4 pb-3 space-y-3">
        <p class="tool-hint" x-text="$store.wf.t('planner_hint')"></p>
        <div class="wf-tabs">
          <button @click="$store.wf.tab='prime'" :class="$store.wf.tab==='prime' && 'on'" x-text="$store.wf.t('tab_prime')"></button>
          <button @click="$store.wf.tab='frames'" :class="$store.wf.tab==='frames' && 'on'" x-text="$store.wf.t('tab_frames')"></button>
        </div>
        <input type="search" x-model="$store.wf.filter" :placeholder="$store.wf.t('filter')" class="wf-input" />
      </div>

      <div class="wf-scroll flex-1">
        <template x-for="item in $store.wf.plannerList()" :key="item.pre + item.name">
          <div class="wf-item" :class="{ sel: $store.wf.someSel(item), open: $store.wf.open[item.name] || $store.wf.filter.length > 1 }">
            <div class="item-row">
              <button @click="$store.wf.open[item.name] = !$store.wf.open[item.name]" class="item-main">
                <span class="tile"><img :src="item.img ? $store.wf.img(item.img) : 'media/lotus.png'" alt="" loading="lazy" :class="!item.img && 'no-img'" @error="$store.wf.noImg($event)" /></span>
                <span class="item-name" x-text="$store.wf.nm(item.name)"></span>
                <span class="item-count" x-show="$store.wf.someSel(item)" x-text="item.parts.filter(p => $store.wf.isSel(item.pre, p.name)).length + '/' + item.parts.length"></span>
              </button>
              <button @click="$store.wf.toggleSet(item)" class="check" :class="$store.wf.allSel(item) && 'on'" :title="$store.wf.t('full_set')" :aria-label="$store.wf.t('full_set')"><i></i></button>
            </div>
            <div x-show="$store.wf.open[item.name] || $store.wf.filter.length > 1" class="part-list">
              <template x-for="p in item.parts" :key="p.name">
                <button @click="$store.wf.toggle(item.pre, p.name)" class="part-opt" :class="$store.wf.isSel(item.pre, p.name) && 'on'"><i></i><span x-text="$store.wf.partShort(item.name, p)"></span></button>
              </template>
            </div>
          </div>
        </template>
        <div x-show="!$store.wf.plannerList().length" class="p-4 text-sm text-dim" x-text="$store.wf.t('nothing')"></div>
      </div>

      <div class="spots" x-show="$store.wf.selList.length">
        <div class="wf-head">
          <h3 x-text="$store.wf.t('where_farm')"></h3>
          <button @click="$store.wf.clearSel()" class="wf-link" x-text="$store.wf.t('clear') + ' · ' + $store.wf.selList.length"></button>
        </div>
        <p x-show="$store.wf.ranking.length" class="px-4 text-[11px] text-dim leading-snug pb-1" x-text="$store.wf.t('best_hint')"></p>
        <div class="wf-scroll px-2 pb-3">
          <template x-for="(h, i) in $store.wf.ranking" :key="h.node.key">
            <button @click="$store.wf.openPlanet(h.node.p, h.node.key)" class="wf-row">
              <span class="wf-rank" x-text="String(i + 1).padStart(2, '0')"></span>
              <span class="flex-1 min-w-0">
                <span class="block text-sm truncate"><span x-text="$store.wf.nodeLabel(h.node)"></span> <span class="text-dim text-xs" x-text="'· ' + $store.wf.planetName(h.node.p)"></span></span>
                <span class="block text-[11px] text-dim truncate" x-text="$store.wf.typeName(h.node.t) + (h.rot ? ' · ' + $store.wf.rotName(h.rot) : '') + ' · ' + h.lines.map(l => $store.wf.nm(l.name).replace(/ Relic.*$/, '')).join(', ')"></span>
              </span>
              <span class="wf-pct text-gold" x-text="$store.wf.fmt(h.eff)"></span>
            </button>
          </template>
        </div>
      </div>
    </section>

    <section class="tool find" x-show="$store.wf.tool === 'find'">
      <div class="px-4 pb-3 space-y-2">
        <input type="search" x-model.debounce.150ms="$store.wf.q" :placeholder="$store.wf.t('search_ph')" class="wf-input" />
        <p x-show="$store.wf.q.length < 2 && !$store.wf.focus" class="tool-hint" x-text="$store.wf.t('search_hint')"></p>
      </div>
      <div x-show="$store.wf.q.length >= 2" class="wf-scroll max-h-[42%] find-results">
        <template x-for="e in $store.wf.results()" :key="e.kind + e.name">
          <button @click="$store.wf.pick(e)" class="wf-row px-3" :class="$store.wf.focus === e.name && 'on'">
            <span class="tile"><img :src="e.img" alt="" loading="lazy" onerror="this.style.visibility='hidden'" /></span>
            <span class="flex-1 min-w-0">
              <span class="block text-sm truncate" x-text="$store.wf.nm(e.name)"></span>
              <span class="kind-label" :style="'color:' + $store.wf.kindColor(e.kind)" x-text="$store.wf.kindName(e.kind) + (e.kind === 'prime' ? ' · ' + ($store.wf.isSel('p:', e.name) ? $store.wf.t('in_plan') : $store.wf.t('add_plan')) : '')"></span>
            </span>
          </button>
        </template>
        <div x-show="!$store.wf.results().length" class="p-3 text-sm text-dim" x-text="$store.wf.t('nothing')"></div>
      </div>
      <div x-show="$store.wf.focus" class="wf-scroll flex-1">
        <div class="wf-head pt-3">
          <h3 class="text-cyan truncate normal-case tracking-normal text-sm" x-text="$store.wf.nm($store.wf.focus)"></h3>
          <button @click="$store.wf.setFocus(null)" class="wf-link" x-text="$store.wf.t('clear')"></button>
        </div>
        <template x-for="p in $store.wf.focusResPlanets()" :key="p">
          <button @click="$store.wf.openPlanet(p)" class="wf-row px-4">
            <span class="flex-1 min-w-0">
              <span class="block text-sm" x-text="$store.wf.planetName(p)"></span>
              <span class="block text-[11px] text-dim" x-text="$store.wf.t('planet_res') + ' — ' + $store.wf.t('from_enemies')"></span>
            </span>
          </button>
        </template>
        <div x-show="$store.wf.findHits.size" class="wf-sub px-4 pt-2" x-text="$store.wf.t('drops_at')"></div>
        <template x-for="h in $store.wf.focusList()" :key="h.node.key">
          <button @click="$store.wf.openPlanet(h.node.p, h.node.key)" class="wf-row px-4">
            <span class="flex-1 min-w-0">
              <span class="block text-sm truncate"><span x-text="$store.wf.nodeLabel(h.node)"></span> <span class="text-dim text-xs" x-text="'· ' + $store.wf.planetName(h.node.p)"></span></span>
              <span class="block text-[11px] text-dim truncate" x-text="$store.wf.typeName(h.node.t) + (h.rot ? ' · ' + $store.wf.rotName(h.rot) : '') + (h.qty ? ' · ' + h.qty : '') + (h.via ? ' · ' + $store.wf.nm(h.via) : '')"></span>
            </span>
            <span class="wf-pct text-cyan" x-text="$store.wf.fmt(h.eff)"></span>
          </button>
        </template>
      </div>
    </section>

    <section class="tool live" x-show="$store.wf.tool === 'live'">
      <div class="wf-scroll flex-1 pb-4">
        <div class="wf-sub px-4" x-text="$store.wf.t('cycles')"></div>
        <div class="cycles">
          <template x-for="c in $store.wf.cycles()" :key="c.id">
            <button class="cyc" :class="'st-' + c.state" @click="$store.wf.openPlanet(c.p)">
              <span class="cyc-place" x-text="c.place"></span>
              <span class="cyc-state"><i></i><span x-text="c.label"></span></span>
              <span class="cyc-left" x-text="$store.wf.left(c.expiry)"></span>
            </button>
          </template>
        </div>
        <p x-show="$store.wf.live.failed" class="px-4 pb-2 text-xs text-danger" x-text="$store.wf.t('live_err')"></p>

        <div class="wf-sub px-4 pt-3" x-text="$store.wf.t('bounties')"></div>
        <template x-for="sy in $store.wf.syndicates()" :key="sy.id">
          <div class="synd" :class="$store.wf.liveOpen[sy.id] && 'open'">
            <button class="synd-head" @click="$store.wf.liveOpen[sy.id] = !$store.wf.liveOpen[sy.id]">
              <i class="synd-arrow"></i>
              <span class="synd-text">
                <span class="synd-name" x-text="sy.label"></span>
                <span class="synd-place" x-text="sy.where"></span>
              </span>
              <span class="synd-left"><small x-text="$store.wf.t('new_in')"></small><span x-text="$store.wf.left(sy.expiry)"></span></span>
            </button>
            <div x-show="$store.wf.liveOpen[sy.id]" class="jobs">
              <template x-for="(j, i) in sy.jobs" :key="i">
                <div class="job" x-data="{ more: false }" :class="more && 'more'" @click="more = !more">
                  <span class="job-lvl" x-text="j.lvl || String(i + 1).padStart(2, '0')"></span>
                  <span class="job-main">
                    <span class="job-title" x-text="j.title"></span>
                    <span class="job-sub" x-show="j.sub" x-text="j.sub"></span>
                    <span class="job-rw" x-show="j.rewards.length" x-text="j.rewards.join(' · ')"></span>
                  </span>
                  <span class="job-rep" x-show="j.rep" x-text="'+' + j.rep"></span>
                </div>
              </template>
              <button class="text-btn" x-show="sy.hub" @click="$store.wf.goHub(sy)"><i></i><span x-text="$store.wf.t('open_hub')"></span></button>
            </div>
          </div>
        </template>
        <p class="px-4 pt-3 text-[11px] text-dim" x-text="$store.wf.t('live_hint')"></p>
      </div>
    </section>
  </aside>

  <aside class="wf-panel panel-right" x-show="$store.wf.loaded && ($store.wf.view || $store.wf.pinned || $store.wf.hub)" x-cloak :class="$store.wf.panel==='right' && 'open'">
    <template x-if="$store.wf.pinnedNode()">
      <div class="flex flex-col min-h-0 flex-1">
        <div class="wf-head items-start">
          <div class="flex-1 min-w-0">
            <h2 x-text="$store.wf.t('node_details')"></h2>
            <div class="node-title" x-text="$store.wf.pinnedNode().n"></div>
            <div class="text-xs text-dim" x-text="$store.wf.planetName($store.wf.pinnedNode().p) + ' · ' + ($store.wf.typeName($store.wf.pinnedNode().t) || '—')"></div>
          </div>
          <button @click="$store.wf.pinned = null; $store.wf.emit()" class="wf-close" :aria-label="$store.wf.t('close')">×</button>
        </div>
        <div class="wf-scroll flex-1 px-3 pb-3 space-y-3">
          <template x-for="g in $store.wf.nodeGroups($store.wf.pinnedNode())" :key="g.rot">
            <div>
              <div x-show="g.rot" class="wf-sub" x-text="$store.wf.rotName(g.rot)"></div>
              <template x-for="r in g.rows" :key="r.it.name">
                <div class="drop-row" :class="$store.wf.isWanted($store.wf.pinnedNode(), r.it) && 'want'">
                  <span class="tile"><img :src="$store.wf.itemImg(r.it)" alt="" loading="lazy" onerror="this.style.visibility='hidden'" /></span>
                  <span class="flex-1 min-w-0">
                    <span class="block truncate text-sm" x-text="(r.qty ? r.qty + ' ' : '') + $store.wf.nm(r.it.name)"></span>
                    <span class="kind-label" :style="'color:' + $store.wf.kindColor(r.it.kind)" x-text="$store.wf.kindName(r.it.kind)"></span>
                  </span>
                  <span class="wf-pct text-dim" x-text="$store.wf.fmt(r.ch)"></span>
                </div>
              </template>
            </div>
          </template>
        </div>
      </div>
    </template>

    <template x-if="!$store.wf.pinnedNode() && $store.wf.pinnedHub()">
      <div class="flex flex-col min-h-0 flex-1">
        <div class="wf-head items-start">
          <div class="flex-1 min-w-0">
            <h2 x-text="$store.wf.hubSub($store.wf.pinnedHub())"></h2>
            <div class="node-title" x-text="$store.wf.hubName($store.wf.pinnedHub())"></div>
            <div class="text-xs text-dim" x-text="$store.wf.planetName($store.wf.pinnedHub().p) + ' · ' + $store.wf.pinnedHub().nodes.length + ' ' + $store.wf.t('missions')"></div>
          </div>
          <button @click="$store.wf.closeHub()" class="wf-close" :aria-label="$store.wf.t('close')">×</button>
        </div>
        <div class="wf-scroll flex-1 pb-3">
          <template x-if="$store.wf.hubLive()">
            <div class="hub-live">
              <div class="wf-sub px-4">
                <span x-text="$store.wf.t('now_here') + ' · ' + ($store.wf.hubLive() || {}).label"></span>
              </div>
              <div class="hub-live-left" x-text="$store.wf.t('new_in') + ' ' + $store.wf.left(($store.wf.hubLive() || {}).expiry)"></div>
              <template x-for="(j, i) in ($store.wf.hubLive() || { jobs: [] }).jobs" :key="i">
                <div class="job" x-data="{ more: false }" :class="more && 'more'" @click="more = !more">
                  <span class="job-lvl" x-text="j.lvl || String(i + 1).padStart(2, '0')"></span>
                  <span class="job-main">
                    <span class="job-title" x-text="j.title"></span>
                    <span class="job-sub" x-show="j.sub" x-text="j.sub"></span>
                    <span class="job-rw" x-show="j.rewards.length" x-text="j.rewards.join(' · ')"></span>
                  </span>
                  <span class="job-rep" x-show="j.rep" x-text="'+' + j.rep"></span>
                </div>
              </template>
            </div>
          </template>
          <div class="wf-sub px-4 pt-3" x-text="$store.wf.t('open_hub')"></div>
          <p class="px-4 pb-2 text-[11px] text-dim" x-text="$store.wf.t('hub_hint')"></p>
          <template x-for="n in $store.wf.pinnedHub().nodes" :key="n.key">
            <button @click="$store.wf.pin(n.key)" @mouseenter="$store.wf.showTip($event, $store.wf.nodeTip(n))" @mousemove="$store.wf.moveTip($event)" @mouseleave="$store.wf.hideTip()" class="wf-row px-4">
              <span x-show="n.lvl" class="hub-lvl" x-text="n.lvl"></span>
              <span class="flex-1 min-w-0">
                <span class="block text-sm truncate" x-text="n.short"></span>
                <span class="block text-[11px] text-dim truncate" x-text="$store.wf.typeName(n.t)"></span>
              </span>
              <span class="wf-pct" :class="$store.wf.planHits.get(n.key) ? 'text-gold' : 'text-cyan'" x-text="$store.wf.planHits.get(n.key) ? $store.wf.fmt($store.wf.planHits.get(n.key).eff) : $store.wf.findHits.get(n.key) ? $store.wf.fmt($store.wf.findHits.get(n.key).eff) : ''"></span>
            </button>
          </template>
        </div>
      </div>
    </template>

    <template x-if="!$store.wf.pinnedNode() && !$store.wf.pinnedHub() && $store.wf.view && $store.wf.viewLoot()">
      <div class="flex flex-col min-h-0 flex-1">
        <div class="wf-head">
          <h2 x-text="$store.wf.planetName($store.wf.view)"></h2>
          <button class="wf-close lg:hidden" @click="$store.wf.panel=null" :aria-label="$store.wf.t('close')">×</button>
        </div>
        <div class="wf-scroll flex-1 pb-3 loot">
          <div class="wf-sub px-4" x-text="$store.wf.t('loot_frames')"></div>
          <div x-show="!$store.wf.viewLoot().frames.length" class="px-4 py-2 text-xs text-dim" x-text="$store.wf.t('loot_none')"></div>
          <template x-for="g in $store.wf.viewLoot().frames" :key="g.name">
            <div class="loot-frame" :class="$store.wf.lootOpen[g.name] && 'open'">
              <button class="wf-row px-4 items-center" @click="$store.wf.lootOpen[g.name] = !$store.wf.lootOpen[g.name]">
                <span class="tile tile-lg"><img :src="g.img ? $store.wf.img(g.img) : 'media/lotus.png'" alt="" :class="!g.img && 'no-img'" @error="$store.wf.noImg($event)" /></span>
                <span class="flex-1 min-w-0">
                  <span class="block text-sm truncate" x-text="$store.wf.nm(g.name)"></span>
                  <span class="loot-parts" x-text="g.parts.map(x => $store.wf.partLabel(g.name, x)).join(' · ')"></span>
                </span>
                <span class="wf-pct" :class="g.parts.length >= g.total ? 'text-gold' : 'text-dim'" x-text="g.parts.length + '/' + g.total"></span>
              </button>
              <div x-show="$store.wf.lootOpen[g.name]" class="pb-2">
                <template x-for="x in g.parts" :key="x.it.name">
                  <button class="loot-line" @click="$store.wf.pin(x.node.key)" @mouseenter="$store.wf.showTip($event, $store.wf.nodeTip(x.node))" @mousemove="$store.wf.moveTip($event)" @mouseleave="$store.wf.hideTip()">
                    <b x-text="$store.wf.partLabel(g.name, x)"></b>
                    <span class="truncate" x-text="$store.wf.nodeLabel(x.node) + (x.rot ? ' · ' + $store.wf.rotName(x.rot) : '')"></span>
                    <em x-text="$store.wf.fmt(x.ch)"></em>
                  </button>
                </template>
                <button x-show="g.set" class="text-btn" :class="g.set && $store.wf.allSel({ ...g.set, pre: 'a:' }) && 'on'" @click="$store.wf.planFrame(g)"><i></i><span x-text="$store.wf.t('full_set') + ' → ' + $store.wf.t('planner_short')"></span></button>
              </div>
            </div>
          </template>

          <div x-show="$store.wf.viewLoot().relics.length" class="wf-sub px-4 pt-3" x-text="$store.wf.t('relics')"></div>
          <template x-for="r in $store.wf.viewLoot().relics" :key="r.tier">
            <div class="relic-line">
              <span class="loot-tier" x-text="$store.wf.tierName(r.tier)"></span>
              <span class="relic-codes">
                <template x-for="x in r.list" :key="x.it.name">
                  <button class="code" :class="$store.wf.focus === x.it.name && 'on'" @click="$store.wf.setFocus(x.it.name); $store.wf.setTool('find')" x-text="$store.wf.nm(x.it.name).replace(/^(Реликвия|Relic) /, '').replace(/ Relic$/, '').replace(/^(Lith|Meso|Neo|Axi|Requiem|Лит|Мезо|Нео|Акси|Реквием) /, '')"></button>
                </template>
              </span>
            </div>
          </template>

          <div x-show="$store.wf.viewLoot().gear.length" class="wf-sub px-4 pt-3" x-text="$store.wf.t('loot_gear')"></div>
          <template x-for="g in $store.wf.viewLoot().gear" :key="g.name">
            <div class="gear">
              <div class="gear-name" x-text="$store.wf.nm(g.name)"></div>
              <div class="gear-parts">
                <template x-for="x in g.parts" :key="x.it.name">
                  <button class="part-link" @click="$store.wf.pin(x.node.key)" @mouseenter="$store.wf.showTip($event, $store.wf.nodeTip(x.node))" @mousemove="$store.wf.moveTip($event)" @mouseleave="$store.wf.hideTip()"><span x-text="$store.wf.partLabel(g.name, x)"></span><em x-text="$store.wf.fmt(x.ch)"></em></button>
                </template>
              </div>
            </div>
          </template>
        </div>
      </div>
    </template>
  </aside>

  <div class="zoom" x-show="$store.wf.loaded" x-cloak>
    <button @click="window.dispatchEvent(new CustomEvent('atlas:zoom', { detail: 1 }))" aria-label="Zoom in"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.3"/></svg></button>
    <button @click="window.dispatchEvent(new CustomEvent('atlas:zoom', { detail: -1 }))" aria-label="Zoom out"><svg viewBox="0 0 16 16"><path d="M3 8h10" stroke="currentColor" stroke-width="1.3"/></svg></button>
    <button @click="window.dispatchEvent(new CustomEvent('atlas:home'))" :aria-label="$store.wf.t('origin')"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="4.5" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M8 1v3.2M8 11.8V15M1 8h3.2M11.8 8H15" stroke="currentColor" stroke-width="1.2"/></svg></button>
  </div>

  <div x-show="$store.wf.tip.show" x-cloak class="map-tip" :style="'left:' + $store.wf.tip.x + 'px;top:' + $store.wf.tip.y + 'px'" x-html="$store.wf.tip.html"></div>
  <div x-show="$store.wf.toast" x-cloak x-transition class="toast" x-text="$store.wf.toast"></div>

  <script src="js/atlas.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <script type="module" src="js/starchart.js"></script>
</body>
</html>
